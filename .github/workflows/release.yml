# Builds and publishes a release when a version tag (x.y.z, as in manifest.json) is pushed.
# The release assets are exactly what Obsidian installs (main.js, manifest.json, styles.css),
# built here from the tagged commit, with signed build provenance attestations that anyone can
# check with `gh attestation verify <file> -R <owner>/<repo>`.
name: Release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  # A manual run checks, tests and builds without attesting or publishing anything.
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: The tag matches manifest.json and versions.json
        if: github.ref_type == 'tag'
        run: |
          test "$(node -p "require('./manifest.json').version")" = "$GITHUB_REF_NAME"
          node -e "const v = require('./versions.json'); if (!v[process.argv[1]]) process.exit(1)" "$GITHUB_REF_NAME"

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - uses: actions/attest@v4
        if: github.ref_type == 'tag'
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="$(node -p "require('./manifest.json').name")"
          awk -v v="$GITHUB_REF_NAME" 'index($0, "## " v " ") == 1 { f = 1; next } /^## / { f = 0 } f' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css \
            --verify-tag --title "$name $GITHUB_REF_NAME" --notes-file notes.md
